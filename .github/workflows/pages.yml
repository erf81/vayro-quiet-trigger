name: Deploy Official Website to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-artifact:
    name: Validate & Stage Static Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required static site files
        run: |
          test -f website/index.html
          test -f website/sitemap.xml
          test -f website/robots.txt
          test -f website/404.html
          test -f website/privacy/index.html
          test -f website/terms/index.html
          test -f website/support/index.html
          test -f website/fa/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

  deploy:
    name: Deploy to GitHub Pages
    needs: build-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
